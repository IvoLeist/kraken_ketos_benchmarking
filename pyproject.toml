[project]
name = "ketos-benchmarking"
version = "0.1.0"
description = "Reproducible Kraken PP-OCRv6 tiny resource benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kraken==7.1.1",
    "psutil>=7,<8",
    "matplotlib>=3.10,<4",
    "torch>=2.9,<=2.14",
    "torchvision>=0.5",
    "benchexec>=3.34,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
docs = ["zensical>=0.0.20,<0.1"]

[tool.uv]
package = false

# Avoid downloading CUDA libraries for the default CPU benchmark.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
