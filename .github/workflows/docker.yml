name: Docker validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ketos-benchmarking:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Harness tests
        run: docker run --rm ketos-benchmarking:ci make test
      - name: Synthetic end-to-end training check
        run: docker run --rm --shm-size=2g ketos-benchmarking:ci make integration-test
      - name: Command and documentation checks
        run: |
          docker run --rm ketos-benchmarking:ci make dry-run SIZES=5 WORKERS=0 THREADS=1 BATCH_SIZES=4
          docker run --rm ketos-benchmarking:ci make docs
      - name: Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.limits.yaml config --quiet
