name: Docker validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ketos-benchmarking:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare Compose storage
        run: |
          mkdir -p training_data artifacts/docker .docker-cache site
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Harness and real BenchExec accounting tests
        run: docker compose run --rm -e BENCHEXEC_INTEGRATION=1 benchmark make test
      - name: Synthetic end-to-end training check
        run: docker compose run --rm benchmark make integration-test
      - name: Command and documentation checks
        run: |
          docker compose run --rm benchmark make dry-run SIZES=5 WORKERS=0 THREADS=1 BATCH_SIZES=4
          docker compose run --rm benchmark make docs
      - name: Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.limits.yaml config --quiet
