# Shared 12-vCPU / 31-GiB KVM VM.
# Apply with: docker compose -f compose.yaml -f compose.limits.yaml ...
# Limits apply per container, not to concurrent jobs or image builds.
services:
  benchmark:
    cpuset: "0-3"
    cpus: 4.0
    mem_limit: 8g
    # Equal RAM and RAM+swap ceilings disable container swap.
    memswap_limit: 8g
    # Shared memory counts toward the 8-GiB memory ceiling.
    shm_size: 2g
    # Includes native library threads and data-loader processes.
    pids_limit: 512
    oom_kill_disable: false
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  docs:
    cpuset: "4"
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 64m
    pids_limit: 128
    oom_kill_disable: false
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
